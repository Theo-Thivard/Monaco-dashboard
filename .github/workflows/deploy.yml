name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # branches d'archive des anciennes versions
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Anciennes versions (versions.json) : publiées sous /v1/, /v2/… sans jamais être supprimées
      # Les archives sont figées : leur construction est conservée d'une publication à l'autre (seules les versions modifiées sont reconstruites)
      - uses: actions/cache@v4
        with:
          path: .build-cache
          key: archives-${{ github.sha }}
          restore-keys: archives-
      - run: BUILD_CACHE="$PWD/.build-cache" scripts/build-versions.sh dist /Monaco-dashboard
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
