name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write # mise à jour automatique de la liste des affichages dans le README
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # branches d'archive des anciennes versions
      # Liste des affichages enregistrés dans le README (liens directs) : mise à jour automatique, sans relancer le déploiement
      - name: README — liste des affichages
        run: |
          node app/scripts/update-readme.mjs
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "README : liste des affichages enregistrés [skip ci]"
            git pull --rebase origin main && git push origin HEAD:main || echo "(mise à jour du README reportée)"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      # Anciennes versions (versions.json) : publiées sous /v1/, /v2/… sans jamais être supprimées
      # Les archives sont figées : leur construction est conservée d'une publication à l'autre (seules les versions modifiées sont reconstruites)
      - uses: actions/cache@v4
        with:
          path: app/.build-cache
          key: archives-${{ github.sha }}
          restore-keys: archives-
      - run: BUILD_CACHE="$PWD/.build-cache" scripts/build-versions.sh dist /Monaco-dashboard
        working-directory: app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
